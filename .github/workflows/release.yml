name: release
run-name: Release by @${{ github.actor }} from ${{ github.ref_name }}

on: [push]

permissions: {}

jobs:
  release:
    if: ${{ github.ref_type == 'branch' }}
    uses: nextmv-io/release/.github/workflows/release.yml@5c6f430394d66a872d32ef892b660feed8811358
    with:
      BRANCH: ${{ github.ref_name }}
      REPOSITORY: go-mip
      LANGUAGE: go
      PACKAGE_NAME: go-mip
      PACKAGE_LOCATION: ./
      VERSION_FILE: VERSION
    permissions:
      contents: write
      pull-requests: write
    secrets:
      SLACK_URL_MISSION_CONTROL: ${{ secrets.SLACK_URL_MISSION_CONTROL }}

  notify:
    needs: [release]
    if: ${{ needs.release.outputs.RELEASE_NEEDED == 'true' && needs.release.outputs.SHOULD_NOTIFY_SLACK == 'true' }}
    uses: nextmv-io/release/.github/workflows/notify-slack.yml@5c6f430394d66a872d32ef892b660feed8811358
    with:
      PACKAGE_NAME: go-mip
      VERSION: ${{ needs.release.outputs.VERSION }}
      REPOSITORY: go-mip
    secrets:
      SLACK_URL_MISSION_CONTROL: ${{ secrets.SLACK_URL_MISSION_CONTROL }}
